name = "rd-scanner-supabase-keepalive"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Cron-only deploy: no public HTTP endpoint.
workers_dev = false

# ONE cron, every hour at minute 17 (UTC). src/index.ts decides from the
# scheduled time what else to do in that run:
#   every run            heartbeat: one database write + one read
#   only if that fails   check project status, restore it if paused
#   03:17 and 15:17 UTC  email any problem that is still unresolved
#   Monday 07:17 UTC     weekly health email (12:47 IST)
#
# Hourly because Supabase pauses a Free plan project without "a few user
# requests to the database each day". The previous schedule (one request
# every 3 days) was far below that and the project was paused anyway.
#
# Minute 17 rather than 00 keeps the run away from the top-of-hour rush.
# Free plan allows 5 cron triggers per account; this uses 1.
[triggers]
crons = ["17 * * * *"]

# Non-secret config. All of it is already public: the Supabase address
# and project ref are in the app, the portal URL and the repo are public.
[vars]
SUPABASE_URL = "https://otkhvevvddxclbormkfo.supabase.co"
SUPABASE_PROJECT_REF = "otkhvevvddxclbormkfo"
PORTAL_URL = "https://rd-scanner-portal.pages.dev"
GITHUB_REPO = "sugamagr/RdQrScanner"
RECIPIENT_EMAIL = "sugamagr@gmail.com"
RESEND_FROM = "onboarding@resend.dev"

# Secrets - set each with `npx wrangler secret put <NAME>`:
#  - SUPABASE_ANON_KEY: from local.properties at repo root. Used for the
#    hourly heartbeat.
#  - SUPABASE_ACCESS_TOKEN: a Supabase account access token, created at
#    https://supabase.com/dashboard/account/tokens. Lets the Worker read
#    the project status and restore the project when it is paused.
#    Without it heartbeats still run but nothing can restore a pause.
#  - RESEND_API_KEY: from https://resend.com (scope "Sending access").
#    The sandbox sender onboarding@resend.dev delivers only to the
#    Resend account owner's address, which is the recipient above.

# Keeps recent runs and their log lines visible in the Cloudflare
# dashboard (Worker -> Observability). Included in the free tier.
[observability]
enabled = true
